# nginx для karatsapov.ru на VPS.
#
# Зачем этот файл появился. Сайт жил на GitHub Pages, и у части российских
# провайдеров он перестал открываться с ошибкой ERR_CONNECTION_CLOSED:
# соединение обрывается на TLS-рукопожатии, когда браузер открытым текстом
# сообщает имя домена. До самих адресов Pages (185.199.108–111.153) сеть
# при этом достаёт — с них отдаётся стандартная страница GitHub. То есть
# режется не адрес, а имя, и ни DNS, ни кэш, ни сертификат тут ни при чём.
# Единственное лечение — уйти с этих адресов на свой сервер.
#
# Куда класть:  /etc/nginx/sites-available/karatsapov.ru
# Включить:     ln -s /etc/nginx/sites-available/karatsapov.ru /etc/nginx/sites-enabled/
# Порядок шагов — в deploy/PEREEZD.md, там же про сертификат.

# ── Отдельный кэш для сжатых ответов не нужен: файлы статические и мелкие ──

server {
    listen 80;
    listen [::]:80;
    server_name karatsapov.ru www.karatsapov.ru;

    # Проверка домена при выпуске и продлении сертификата. Каталог намеренно
    # ВНЕ /var/www/landing: деплой ходит туда через rsync --delete и снёс бы
    # проверочный файл. Это ломается не сразу, а через три месяца на первом
    # автоматическом продлении — самый неприятный тип поломки.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # Всё остальное — на https. Отдельным блоком, а не внутри общего сервера:
    # так редирект не мешает проверке сертификата.
    location / {
        return 301 https://karatsapov.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.karatsapov.ru;

    # Пути к сертификату подставит certbot при первом запуске.
    ssl_certificate     /etc/letsencrypt/live/karatsapov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karatsapov.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www склеивается с основным адресом. Без этого поисковик видит два
    # разных сайта с одинаковым содержимым, и вес делится пополам.
    return 301 https://karatsapov.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name karatsapov.ru;

    root /var/www/landing;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/karatsapov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karatsapov.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Сжатие ────────────────────────────────────────────────────────────
    # Картинки и шрифты сюда не входят: webp, jpg и woff2 уже сжаты, и
    # повторное сжатие только тратит процессор.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ── Заголовки безопасности ────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HSTS включать ТОЛЬКО после того, как https проверен и работает.
    # Заголовок говорит браузеру полгода не ходить на сайт по http, и отменить
    # это у тех, кто уже успел его получить, нельзя — придётся ждать, пока
    # истечёт срок. Раскомментировать через несколько дней спокойной работы.
    # add_header Strict-Transport-Security "max-age=15768000" always;

    # ── Кэширование ───────────────────────────────────────────────────────
    # Имена файлов в сборке без хэшей, поэтому вечный кэш ставить нельзя:
    # обновлённый landing.css не доедет до тех, у кого он уже лежит.
    # Картинкам и шрифтам месяц — они меняются вместе с именем.
    location ~* \.(?:jpg|jpeg|png|webp|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Стилям и скриптам — сутки с обязательной перепроверкой.
    location ~* \.(?:css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Разметка не кэшируется вовсе: правки текста должны быть видны сразу.
    location ~* \.(?:html|json|xml|txt)$ {
        add_header Cache-Control "no-cache";
    }

    # ── Маршрутизация ─────────────────────────────────────────────────────
    # Страницы лежат каталогами с index.html внутри: /about/ → /about/index.html.
    # Обращение без завершающего слэша nginx превращает в адрес со слэшем сам.
    location / {
        try_files $uri $uri/ =404;
    }

    # Своя страница «не найдено» вместо стандартной nginx.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Служебные файлы отдаём как обычные, но без записи в журнал:
    # роботы дёргают их постоянно и засоряют логи.
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    # Скрытые файлы наружу не отдаём.
    location ~ /\. { deny all; }
}
