# nginx для karatsapov.ru.
#
# Зачем переезд. На GitHub Pages сайт открывался не у всех: у части
# провайдеров соединение обрывалось с ERR_CONNECTION_CLOSED — то есть уже
# на TLS-рукопожатии, где имя сайта идёт открытым текстом. До самих адресов
# Pages (185.199.108–111.153) сеть при этом достаёт: с них отдаётся
# стандартная страница GitHub. Режется имя, а не адрес, поэтому ни DNS, ни
# кэш, ни перевыпуск сертификата не помогают. Лечится сменой хостинга.
#
# Здесь ТОЛЬКО http. Так и задумано: блок с сертификатом допишет certbot,
# когда домен уже будет указывать на этот сервер. Обратный порядок —
# положить конфиг со ссылками на сертификат, которого ещё нет, — валит
# `nginx -t` и мешает выпустить сертификат вообще.
#
# Ставится скриптом deploy/setup-vps.sh, порядок шагов — в deploy/PEREEZD.md.

server {
    listen 80;
    listen [::]:80;
    server_name karatsapov.ru www.karatsapov.ru;

    root /var/www/landing;
    index index.html;
    charset utf-8;

    # Проверка домена при выпуске и продлении сертификата. Каталог намеренно
    # ВНЕ /var/www/landing: деплой ходит туда через rsync --delete и снёс бы
    # проверочный файл. Сломалось бы это не сразу, а через три месяца на
    # первом автоматическом продлении — самый неприятный вид поломки.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # ── Сжатие ────────────────────────────────────────────────────────────
    # Картинки и шрифты сюда не входят: webp, jpg и woff2 уже сжаты, и
    # повторное сжатие только тратит процессор.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ── Заголовки безопасности ────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HSTS здесь намеренно нет. Его добавляют вручную и только после
    # нескольких дней спокойной работы по https: заголовок запрещает
    # браузеру полгода ходить на сайт по http, и отменить это у тех, кто
    # уже его получил, нельзя.

    # ── Кэширование ───────────────────────────────────────────────────────
    # Имена файлов в сборке без хэшей, поэтому вечный кэш ставить нельзя:
    # обновлённый landing.css не доедет до тех, у кого он уже лежит.
    location ~* \.(?:jpg|jpeg|png|webp|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location ~* \.(?:css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }
    # Разметка не кэшируется вовсе: правки текста должны быть видны сразу.
    location ~* \.(?:html|json|xml|txt)$ {
        add_header Cache-Control "no-cache";
    }

    # ── Маршрутизация ─────────────────────────────────────────────────────
    # Страницы лежат каталогами с index.html внутри: /about/ → /about/index.html.
    # Обращение без завершающего слэша nginx сам превращает в адрес со слэшем.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Служебные файлы отдаём как обычные, но без записи в журнал:
    # роботы дёргают их постоянно и засоряют логи.
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ /\. { deny all; }
}

# ── Старый домен ────────────────────────────────────────────────────────
# Сайт раньше жил на кириллическом домене, и тот до сих пор указывает на
# этот сервер. Домен больше не нужен, но просто выключить его нельзя: на
# него ведут ссылки из уже опубликованных материалов и он сидит в индексе
# поисковиков. Постоянный редирект передаёт накопленный вес новому адресу,
# а посетителя по старой ссылке приводит куда надо.
#
# Оба блока можно удалить целиком, когда домен перестанет оплачиваться.
# Сертификат для него на сервере уже есть — он от прежней настройки.

server {
    listen 80;
    listen [::]:80;
    server_name xn-----6kcaabbmngo7aadrlotojgvup6c4e.xn--p1ai
                www.xn-----6kcaabbmngo7aadrlotojgvup6c4e.xn--p1ai;
    return 301 https://karatsapov.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xn-----6kcaabbmngo7aadrlotojgvup6c4e.xn--p1ai
                www.xn-----6kcaabbmngo7aadrlotojgvup6c4e.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn-----6kcaabbmngo7aadrlotojgvup6c4e.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn-----6kcaabbmngo7aadrlotojgvup6c4e.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://karatsapov.ru$request_uri;
}
