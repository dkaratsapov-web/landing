name: Deploy to VPS

on:
  push:
    branches: [main]
  # Повтор по расписанию. Когда сервер недоступен, выкладка не состоится — и
  # без этого сайт остаётся на старой версии до тех пор, пока человек сам не
  # нажмёт «Re-run». Раз в двадцать минут прогон повторяется сам: сервер
  # поднялся — сайт обновился, никого просить не нужно.
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история нужна сборке: lastmod в sitemap.xml берётся
          # из даты последнего коммита каждой страницы.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build deps
        run: npm install

      - name: Build site (project -> dist)
        run: npm run build

      - name: Deploy dist/ to VPS via rsync over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ssh-keyscan лишь наполняет known_hosts — проверку ключа всё равно
          # снимает StrictHostKeyChecking=no. Раньше его stderr уходил в
          # /dev/null, а bash -e ронял весь шаг на ненулевом коде: в логе не
          # оставалось ни строки о причине, только «exit code 1». Ошибку
          # больше не глушим и шаг на ней не роняем.
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts \
            || echo "ssh-keyscan не опросил хост — иду дальше, связь проверяется ниже"

          # Явная проба связи до rsync. Нужна ради лога: если сервер лежит,
          # в отчёте должно быть написано «сервер не отвечает», а не пустой
          # шаг с кодом 1, по которому непонятно, код это или инфраструктура.
          echo "Проверяю доступность сервера по SSH…"
          if ! ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=15 -o BatchMode=yes \
                   "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'echo сервер отвечает'; then
            # Недоступный сервер — не ошибка сборки. На пуше об этом надо
            # кричать: человек только что отправил правку и должен знать, что
            # она не доехала. На повторе по расписанию — нет: это фоновая
            # попытка, и падающий каждые двадцать минут прогон превратится в
            # поток писем, который перестанут читать, а вместе с ним
            # перестанут замечать и настоящие поломки.
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::warning::Сервер всё ещё не отвечает. Повторю через двадцать минут."
              exit 0
            fi
            echo "::error::Сервер не отвечает по SSH. Сборка прошла, выкладка не состоялась — сайт остался на прошлой версии."
            exit 1
          fi

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=15" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/landing/"
